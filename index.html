<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Petit Docteur</title>
<meta name="description" content="Conseils de santé relus par un médecin et consultations en ligne.">
<meta name="theme-color" content="#0F4C5C">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" href="/icon-192.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Petit Docteur"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="stylesheet" href="/static/style.css"></head>
<body>
<div class="shell">
<aside class="rail"><a href="#/" class="logo" aria-label="Accueil Petit Docteur"><span class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/><circle cx="19" cy="5" r="1.6" fill="#F2B134" stroke="none"/></svg></span><span>Petit<br>Docteur</span></a><nav id="nav" aria-label="Navigation"></nav></aside>
<div class="col">
<header class="bar">
<form id="gform" class="gsearch" role="search"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg><input id="gq" type="search" placeholder="Un mal, un symptôme…" aria-label="Rechercher un mal ou un symptôme" enterkeyhint="search"></form>
<button id="install" class="pri hide" type="button">Installer l'app</button>
<a id="bell" class="ibtn hide" href="#/messages" aria-label="Notifications"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg><span id="bellN" class="nbadge hide"></span></a>
<a id="who" class="whoami" href="#/compte"></a>
</header>
<main id="view"></main>
</div></div>

<div id="incoming" class="overlay hide" role="dialog" aria-label="Appel entrant">
  <div class="box"><p class="big" id="inc-t">Appel entrant</p>
  <div class="row"><button class="pri" id="inc-ok">Répondre</button><button id="inc-no">Refuser</button></div></div>
</div>

<div id="callbox" class="overlay hide" role="dialog" aria-label="Appel vidéo">
  <div class="callwrap">
    <video id="rv" autoplay playsinline></video>
    <video id="lv" autoplay playsinline muted></video>
    <p id="callmsg" class="callmsg">Appel en cours…</p>
    <div class="callbar">
      <button id="c-mic" aria-pressed="false">Micro</button>
      <button id="c-cam" aria-pressed="false">Caméra</button>
      <button id="c-end" class="danger">Raccrocher</button>
    </div>
    <a id="c-alt" class="callalt" target="_blank" rel="noopener" href="#">Problème de connexion ? Ouvrir l'appel de secours</a>
  </div>
</div>
<script src="/static/app.js"></script>
</body></html>
